name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        # The suite is fully offline by design: no API key, no network.
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          python -m jevskill --version
          python -m jevskill patterns --json > /dev/null
          python -m jevskill plan "categorize which module owns this failure" > /dev/null

      - name: Bundled skill scripts work without the package
        # The skill must be usable with nothing installed. Run its scripts
        # against a clean interpreter path so an accidental package import fails
        # here rather than in someone's harness.
        run: |
          cd skills/jev
          python scripts/jev_query.py --help > /dev/null
          python scripts/jev_recovery.py --help > /dev/null
          python scripts/jev_recovery.py --list
